name: Update channel report

on:
  schedule:
    - cron: "23 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      limit:
        description: "Max videos to analyse this run (0 = no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check channels and analyse new videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m tracker run --limit "${{ github.event.inputs.limit || 0 }}" --max-runtime 50

      - name: Commit updated data and dashboard
        if: always()
        run: |
          git config user.name  "channel-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Report update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
